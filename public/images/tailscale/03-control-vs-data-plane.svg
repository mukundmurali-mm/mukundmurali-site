<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-label="Control plane exchanges keys while the data plane carries encrypted traffic directly"><title>Control plane exchanges keys while the data plane carries encrypted traffic directly</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="920" height="380" fill="#ffffff"/><g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="300" y="30" width="320" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="460.0" y="67.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Coordination server</text><text x="460.0" y="85.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">a drop box for public keys and policy</text><rect x="70" y="250" width="190" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="292.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Phone</text><text x="165.0" y="310.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">private key stays here</text><rect x="660" y="250" width="190" height="90" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="755.0" y="292.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Mac mini</text><text x="755.0" y="310.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">private key stays here</text><line x1="340" y1="110" x2="200" y2="250" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aq)"/><line x1="580" y1="110" x2="720" y2="250" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aq)"/><text x="205" y="165" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">public key +</text><text x="205" y="181" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">current address</text><text x="715" y="165" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">public key +</text><text x="715" y="181" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">current address</text><text x="460" y="200" font-size="12.5" fill="#d97706" font-weight="600" text-anchor="middle">Control plane: tiny messages,</text><text x="460" y="218" font-size="12.5" fill="#d97706" font-weight="600" text-anchor="middle">almost no traffic</text><line x1="260" y1="295" x2="660" y2="295" stroke="#059669" stroke-width="3.5" marker-start="url(#ag)" marker-end="url(#ag)"/><rect x="305.0" y="283" width="310" height="24" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="460" y="299.5" font-size="11.5" fill="#059669" font-weight="600" text-anchor="middle">Data plane: encrypted traffic, device to device</text><text x="460" y="335" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Tailscale's servers never see this traffic and cannot decrypt it</text></g></svg>