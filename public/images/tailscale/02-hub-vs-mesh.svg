<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Hub and spoke network compared with a mesh network"><title>Hub and spoke network compared with a mesh network</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="920" height="400" fill="#ffffff"/><g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="230" y="34" font-size="17" fill="#1f2937" font-weight="700" text-anchor="middle">Hub and spoke</text><text x="230" y="54" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle">Everything goes through one point</text><text x="690" y="34" font-size="17" fill="#1f2937" font-weight="700" text-anchor="middle">Mesh</text><text x="690" y="54" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle">Devices talk to each other directly</text><line x1="230" y1="215" x2="230.0" y2="95.0" stroke="#9ca3af" stroke-width="2"/><line x1="230" y1="215" x2="344.12678195541844" y2="177.91796067500633" stroke="#9ca3af" stroke-width="2"/><line x1="230" y1="215" x2="300.5342302750968" y2="312.08203932499373" stroke="#9ca3af" stroke-width="2"/><line x1="230" y1="215" x2="159.46576972490323" y2="312.08203932499373" stroke="#9ca3af" stroke-width="2"/><line x1="230" y1="215" x2="115.87321804458156" y2="177.91796067500633" stroke="#9ca3af