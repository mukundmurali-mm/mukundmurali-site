<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Only devices with the right key can reach the Mac"><title>Only devices with the right key can reach the Mac</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="920" height="360" fill="#ffffff"/><g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><g transform="translate(0,-50)"><rect x="60" y="140" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="145.0" y="172.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Phone</text><text x="145.0" y="190.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">on my tailnet</text><rect x="60" y="260" width="170" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="145.0" y="292.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Stranger</text><text x="145.0" y="310.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">not on my tailnet</text><rect x="400" y="95" width="160" height="270" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="480" y="125" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">Device filter</text><text x="480" y="144" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">decides at decryption time</text><rect x="660" y="150" width="200" height="150" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="760.0" y="178" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Mac mini</text><text x="760.0" y="206" font-size="13" fill="#1f2937" font-weight="500" text-anchor="middle">Pi Pocket</text><text x="760.0" y="228" font-size="13" fill="#1f2937" font-weight="500" text-anchor="middle">OpenMausBot</text><text x="760.0" y="250" font-size="13" fill="#1f2937" font-weight="500" text-anchor="middle">Hermes</text><line x1="230" y1="175" x2="400" y2="215" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/><line x1="560" y1="225" x2="660" y2="225" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/><text x="300" y="168" font-size="12" fill="#059669" font-weight="600" text-anchor="middle">has the right key</text><line x1="230" y1="295" x2="395" y2="270" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="402" cy="268" r="11" fill="#dc2626"/><text x="402" y="273" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">x</text><text x="250" y="332" font-size="12" fill="#dc2626" font-weight="600" text-anchor="start">no key: cannot even ask</text><text x="460" y="392" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="middle">Each device enforces the rules itself, and no rule means no connection</text></g></g></svg>