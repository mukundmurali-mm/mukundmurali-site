<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="A direct connection through NAT, with a relay as the fallback"><title>A direct connection through NAT, with a relay as the fallback</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="920" height="400" fill="#ffffff"/><g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="30" y="130" width="250" height="220" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="155" y="152" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Mobile network (NAT)</text><rect x="640" y="130" width="250" height="220" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="765" y="152" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Home network (router NAT)</text><rect x="65" y="200" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="155.0" y="232.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Phone</text><text x="155.0" y="250.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">no open port</text><rect x="675" y="200" width="180" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="765.0" y="232.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Mac mini</text><text x="765.0" y="250.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">no open port</text><rect x="360" y="30" width="200" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="460.0" y="57.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Coordination server</text><text x="460.0" y="75.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">shares keys + addresses</text><line x1="180" y1="200" x2="380" y2="90" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aq)"/><line x1="740" y1="200" x2="540" y2="90" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aq)"/><line x1="245" y1="225" x2="675" y2="225" stroke="#059669" stroke-width="3.5" marker-start="url(#ag)" marker-end="url(#ag)"/><rect x="320.0" y="213" width="280" height="24" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="460" y="229.5" font-size="11.5" fill="#059669" font-weight="600" text-anchor="middle">1. Direct: NAT traversal (STUN / ICE)</text><rect x="370" y="290" width="180" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="460.0" y="315.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">DERP relay</text><text x="460.0" y="333.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">forwards encrypted bytes</text><line x1="210" y1="270" x2="370" y2="318" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-start="url(#ao)" marker-end="url(#ao)"/><line x1="550" y1="318" x2="710" y2="270" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-start="url(#ao)" marker-end="url(#ao)"/><text x="460" y="372" font-size="12" fill="#d97706" font-weight="600" text-anchor="middle">2. Fallback if the network blocks UDP: relay over HTTPS, still end-to-end encrypted</text></g></svg>