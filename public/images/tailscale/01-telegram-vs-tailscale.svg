<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-label="Telegram gateway compared with a direct Tailscale tunnel"><title>Telegram gateway compared with a direct Tailscale tunnel</title><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="920" height="410" fill="#ffffff"/><g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="34" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">Before: Telegram bot as a gateway</text><text x="30" y="54" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Nothing is exposed, but everything squeezes through a chat window</text><rect x="40" y="80" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="115.0" y="112.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Phone</text><text x="115.0" y="130.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">Telegram app</text><rect x="375" y="80" width="170" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="460.0" y="112.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Telegram</text><text x="460.0" y="130.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">carries the messages</text><rect x="730" y="80" width="150" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="805.0" y="112.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Mac mini</text><text x="805.0" y="130.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">Hermes agent</text><line x1="190" y1="115" x2="375" y2="115" stroke="#6b7280" stroke-width="2.2" marker-start="url(#aq)" marker-end="url(#aq)"/><line x1="730" y1="115" x2="545" y2="115" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aq)"/><text x="282" y="104" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">message</text><text x="637" y="104" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">Mac reaches out, no inbound port</text><text x="460" y="178" font-size="12.5" fill="#dc2626" font-weight="400" text-anchor="middle">Everything goes through a chat window</text><line x1="30" y1="205" x2="890" y2="205" stroke="#e5e7eb" stroke-width="1.5"/><text x="30" y="242" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">After: Tailscale, phone straight to Mac</text><text x="30" y="262" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Private tunnel between my own devices. The real interface, from anywhere</text><rect x="40" y="290" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="115.0" y="322.0" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Phone</text><text x="115.0" y="340.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">Tailscale app on</text><rect x="690" y="270" width="190" height="120" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="785.0" y="298" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Mac mini</text><text x="785.0" y="326" font-size="13" fill="#1f2937" font-weight="500" text-anchor="middle">Pi Pocket</text><text x="785.0" y="348" font-size="13" fill="#1f2937" font-weight="500" text-anchor="middle">OpenMausBot</text><text x="785.0" y="370" font-size="13" fill="#1f2937" font-weight="500" text-anchor="middle">Hermes</text><line x1="190" y1="330" x2="690" y2="330" stroke="#059669" stroke-width="3" marker-start="url(#ag)" marker-end="url(#ag)"/><rect x="345.2" y="318" width="189.6" height="24" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="440" y="334.5" font-size="11.5" fill="#059669" font-weight="600" text-anchor="middle">encrypted WireGuard tunnel</text><text x="440" y="362" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">No open port on my router</text></g></svg>